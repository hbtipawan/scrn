name: Daily update

on:
  schedule:
    # 13:10 UTC = 6:40 PM IST, Monday to Friday (after NSE close and bhavcopy)
    - cron: "10 13 * * 1-5"
  workflow_dispatch:
    inputs:
      source:
        description: "Price source"
        type: choice
        options: [upstox, yahoo]
        default: upstox
      mf_rebuild:
        description: "Rebuild mutual-fund flows"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Refresh sectors and index lists (keeps old files if NSE site fails)
        run: python scripts/update_reference.py

      - name: Download prices from Upstox
        id: upstox
        if: (inputs.source || 'upstox') == 'upstox'
        continue-on-error: true
        run: python scripts/fetch_prices.py --source upstox

      - name: Fall back to Yahoo if Upstox failed
        if: steps.upstox.outcome != 'success'
        run: python scripts/fetch_prices.py --source yahoo

      # NSE's own daily files, kept in config/nse/: delivery quantities, every index's close / P/E / P/B /
      # dividend yield and India VIX, corporate actions, the holiday list. Also checks the last session's
      # closes in the price file against NSE's official closes and corrects any that differ.
      - name: NSE daily files (delivery, index valuations, VIX, corporate actions, holidays) + official-close check
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/fetch_nse_daily.py --wait 10

      - name: Older BSE prices for stocks recently listed on NSE (for the long-base identifier)
        continue-on-error: true
        timeout-minutes: 10
        run: python scripts/fetch_bse_backfill.py

      - name: Fundamentals from NSE filings (new results and shareholding only)
        continue-on-error: true
        timeout-minutes: 45
        run: python scripts/fetch_fundamentals.py

      # One time only: the first year of fund portfolios arrives packed (config/mf_seed/*.tar.gz, one per month,
      # so it can be uploaded through the GitHub website). Unpack it into config/mf/ and drop the packed copy.
      - name: Unpack the starting fund-portfolio data (first run after the Fund flows update)
        if: hashFiles('config/mf_seed/*.tar.gz') != ''
        run: |
          mkdir -p config/mf
          for f in config/mf_seed/*.tar.gz; do tar -xzf "$f" -C config/mf; done
          git rm -r -q config/mf_seed
          ls config/mf

      # Mutual-fund portfolios: every fund house publishes each scheme's month-end holdings within 10 days.
      # From the 1st to the 20th the job reads any new files (config/mf/YYYY-MM/), then rebuilds the flows.
      - name: Mutual-fund portfolios (1st–20th of each month)
        id: mf
        continue-on-error: true
        timeout-minutes: 45
        run: |
          if [ "$(date -u +%-d)" -gt 20 ] && [ "${{ inputs.mf_rebuild }}" != "true" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"; echo "Not the 1st–20th of the month: skipped"; exit 0
          fi
          pip install -r requirements-mf.txt
          python -m playwright install --with-deps chromium
          python scripts/fetch_mf.py --auto

      - name: Mutual-fund flows (when new portfolios were saved)
        if: steps.mf.outputs.changed == 'true' || inputs.mf_rebuild
        continue-on-error: true
        timeout-minutes: 15
        run: |
          curl -sSfL --retry 3 -o cache/amfi_schemes.csv "https://portal.amfiindia.com/DownloadSchemeData_Po.aspx?mf=0" || echo "AMFI scheme list not downloaded"
          python scripts/mf_flows.py

      - name: All-time-high reference (rebuilt weekly, ~5 min)
        continue-on-error: true
        run: python scripts/fetch_ath.py

      - name: Compute dashboard data
        run: python scripts/compute.py

      - name: Run VPCI screener (vpci/app.py logic, both weekly modes)
        continue-on-error: true
        run: python scripts/vpci_app_run.py

      - name: Telegram evening digest (only if the Telegram secrets are set)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python scripts/telegram_alerts.py --evening

      - name: Save data to the repository
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          # Keep only what the next run needs (config incl. fundamentals, weekly VPCI sector snapshots).
          # The website's data files are published straight to Pages below, so they are not
          # committed every night - that keeps the repository small.
          git add config docs/data/vpci/history
          git diff --cached --quiet || git commit -m "Data update $(date -u +%F)"
          # Take in any commit made while this job ran (e.g. an edit to themes.csv)
          git pull --rebase --autostash -X theirs origin main
          git push

      # Commits made by this job do not trigger a GitHub Pages rebuild,
      # so the job publishes the website itself.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v5
