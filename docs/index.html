const TABS=["rotation","breadth","rs","scanners","bases","results","watch","vpci"];
const st={tab:"rotation",period:"1M",group:"Themes",agg:"mean",sort:"ret",view:"bars",open:null,scan:"combo3",scanTop:0,scanFund:0,uni:"all",
  rs:{q:"",sec:"",theme:"",min:0,fmin:0,tt:false,s2:false,a50:false,all:false},tbl:{}};
let D={};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum=v=>typeof v==="number"&&isFinite(v);
const sgn=(v,d=2,u="%")=>!isNum(v)?"–":(v>0?"+":v<0?"−":"")+Math.abs(v).toFixed(d)+u;
const cls=v=>!isNum(v)?"":v>0?"up":v<0?"down":"";
const inr=v=>!isNum(v)?"–":v.toLocaleString("en-IN",{maximumFractionDigits:v>=1000?0:2});
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const median=a=>{const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
const store={get(k,d){try{const v=localStorage.getItem("radar."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("radar."+k,JSON.stringify(v))}catch(e){}}};
const tv=(s,ex)=>`https://in.tradingview.com/chart/?symbol=${encodeURIComponent((ex||"NSE")+":"+s)}`;
function seg(name,opts,cur,labels){return `<div class="seg" role="group" aria-label="${esc(name)}">`+opts.map(o=>`<button type="button" data-seg="${name}" data-val="${esc(o)}" aria-pressed="${o===cur}">${esc(labels?labels[o]:o)}</button>`).join("")+`</div>`}
function rsPill(v){if(!isNum(v))return "–";const c=v>=90?"rs-a":v>=70?"rs-b":v>=40?"rs-c":"rs-d";return `<span class="rs ${c}">${v}</span>`}
function stagePill(s){return !s?"–":s===2?`<span class="pill p-up">Stage 2</span>`:s===4?`<span class="pill p-down">Stage 4</span>`:s===1?`<span class="pill p-mut">Stage 1</span>`:`<span class="pill p-mut">Stage 3</span>`}
const symBtn=(s,n,ex)=>wlStar(s)+`<button type="button" class="symbtn" data-sym="${esc(s)}"${ex?` data-ex="${esc(ex)}"`:""}>${esc(s)}</button>${n?`<span class="nm">${esc(n)}</span>`:""}`;
function fmtDate(d){if(!d)return"";const t=new Date(String(d).slice(0,10)+"T00:00:00");return isNaN(t)?String(d):t.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}

/* ════════════════════ data ════════════════════ */
async function load(){
  if(window.EMBED){D=window.EMBED;return}
  const get=n=>fetch(`data/${n}.json?v=${Date.now()}`).then(r=>{if(!r.ok)throw new Error(`${n}.json (${r.status})`);return r.json()});
  const [meta,stocks,groups,breadth,scans]=await Promise.all(["meta","stocks","groups","breadth","scans"].map(get));
  D={meta,stocks,groups,breadth,scans};
}
function index(){
  D.by=Object.fromEntries(D.stocks.map(s=>[s.s,s]));
  D.themesOf={};for(const [t,ss] of Object.entries(D.groups.Themes||{}))for(const s of ss)(D.themesOf[s]=D.themesOf[s]||[]).push(t);
  D.scansOf={};const sc=D.scans||{};
  if(sc.meta)for(const m of sc.meta)for(const s of (sc.hits[m.id]||[]))(D.scansOf[s]=D.scansOf[s]||[]).push(m.id);
  D.scanMeta=Object.fromEntries((sc.meta||[]).map(m=>[m.id,m]));
  D.liq=D.stocks.filter(x=>x.lq!==0);
}
/* Breadth and rotation can use every stock trading on NSE (default) or only the liquid universe that the
   scanners and the RS ranking use. */
const inUni=s=>st.uni!=="lq"||(D.by[s]&&D.by[s].lq!==0);
function uniB(){const b=D.breadth;return st.uni==="lq"&&b.lq?Object.assign({},b,b.lq):b}
function uniSeg(){const u=D.breadth.universe;if(!u)return "";return `<div class="ctl"><span>Stocks</span>${seg("uni",["all","lq"],st.uni,{all:`All ${u.all.toLocaleString("en-IN")}`,lq:`Liquid ${u.lq.toLocaleString("en-IN")}`})}</div>`}
const uniWord=()=>st.uni==="lq"?`the ${D.meta.universe.toLocaleString("en-IN")} liquid stocks`:`all ${(D.meta.all_stocks||D.meta.universe).toLocaleString("en-IN")} NSE stocks`;

/* ════════════════════ header & pulse ════════════════════ */
function renderHeader(){
  const m=D.meta;
  $("#asof").textContent=`Prices to ${fmtDate(m.asof)} · updated ${m.generated.replace(/^\d{4}-\d{2}-\d{2} /,"")}`;
  const n=Object.values(D.scans?.hits||{}).filter(a=>a.length).length;$("#scanCnt").textContent=n||"";
  const rc=D.meta.results?.n;$("#resCnt").textContent=rc||"";
}
function renderPulse(){
  const m=D.meta,b=uniB(),L=b.dates.length-1,bn=b.bench_name,ix=m.indices||{},main=ix[bn]||Object.values(ix)[0];
  const r=main?.r?.[st.period];
  const N=Math.min(130,b.bench.length),ser=b.bench.slice(-N),vals=ser.filter(isNum);
  let spark="";
  if(vals.length>2){const lo=Math.min(...vals),hi=Math.max(...vals),W=400,H=76,x=i=>i*(W/(N-1)),y=v=>H-4-(v-lo)/(hi-lo||1)*(H-10);
    let d="";ser.forEach((v,i)=>{if(isNum(v))d+=(d?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1)});
    spark=`<svg class="spark" viewBox="0 0 400 76" preserveAspectRatio="none" role="img" aria-label="${esc(bn)} over the last ${N} sessions"><path class="a" d="${d}L${W},${H}L0,${H}Z"/><path class="l" d="${d}"/></svg>`}
  const others=Object.entries(ix).filter(([k])=>k!==bn);
  const a50=b.a50[L],a200=b.a200[L],adv=b.adv[L],dec=b.dec[L],nh=b.nh[L],nl=b.nl[L],u4=b.up4[L],d4=b.dn4[L];
  const vd=a50>=60?["Strong","up"]:a50>=40?["Mixed",""]:["Weak","down"];
  const d50=a50-b.a50[Math.max(0,L-5)],tt=(D.scans?.hits?.trend_template||[]).length;
  const split=(a,c)=>{const t=a+c||1;return `<div class="meter split" aria-hidden="true"><i style="width:${a/t*100}%"></i><i style="width:${c/t*100}%"></i></div>`};
  $("#pulse").innerHTML=`
  <div class="hero-idx">
    <div class="lab"><span>${esc(bn)}</span><span>${st.period==="1D"?"Today":PL[st.period]+" change"}</span></div>
    <div><span class="val num">${main?inr(main.px):"–"}</span><span class="chg num ${cls(r)}">${sgn(r)}</span></div>
    ${spark}
    <div class="minis">${others.map(([k,v])=>`<div class="mini"><span>${esc(k.replace("NIFTY ","Nifty ").replace("SMLCAP","Smallcap").replace("MIDCAP","Midcap").replace("MICROCAP","Microcap "))}</span><b class="num ${cls(v.r[st.period])}">${sgn(v.r[st.period])}</b></div>`).join("")}${m.idx?.vix?`<div class="mini" title="India VIX: expected volatility for the next 30 days; ${ordp(m.idx.vix.p1y)} of the last year"><span>India VIX</span><b class="num">${m.idx.vix.v.toFixed(2)} <span class="${cls(-m.idx.vix.d1)}">${m.idx.vix.d1>0?"+":""}${m.idx.vix.d1}%</span></b></div>`:""}${isNum(m.idx?.pe50?.pe)?`<div class="mini" title="NSE's Nifty 50 P/E; percentile among daily readings since ${esc(m.idx.basis)} (consolidated earnings); median ${m.idx.pe50.m}"><span>Nifty 50 P/E</span><b class="num">${m.idx.pe50.pe.toFixed(1)}${isNum(m.idx.pe50.p)?` <span style="font-weight:500;color:var(--band-muted)">· ${m.idx.pe50.p===0?"low since 2021":ordp(m.idx.pe50.p).replace(" percentile"," pct")}</span>`:""}</b></div>`:""}</div>
  </div>
  <div class="health">
    <div class="verdict"><span class="k">Breadth reading</span><span class="v ${vd[1]}" style="${vd[1]?"":"color:var(--accent)"}">${vd[0]}</span>
      <span class="why">${a50.toFixed(1)}% of ${(b.n?b.n[L]:m.universe).toLocaleString("en-IN")} ${st.uni==="lq"?"liquid ":""}stocks above their 50 DMA · <span class="${cls(d50)}">${d50>0?"+":""}${d50.toFixed(1)} pts</span> in a week</span></div>
    <div class="hm"><div class="k"><span>Above 50 DMA</span><b class="num">${a50.toFixed(1)}%</b></div><div class="meter"><i style="width:${a50}%"></i><span class="tick" style="left:50%"></span></div></div>
    <div class="hm"><div class="k"><span>Above 200 DMA</span><b class="num">${a200.toFixed(1)}%</b></div><div class="meter"><i style="width:${a200}%"></i><span class="tick" style="left:50%"></span></div></div>
    <div class="hm"><div class="k"><span>Advances / declines</span><b class="num"><span class="up">${adv}</span> / <span class="down">${dec}</span></b></div>${split(adv,dec)}</div>
    <div class="hm"><div class="k"><span>52-week highs / lows</span><b class="num"><span class="up">${nh}</span> / <span class="down">${nl}</span></b></div>${split(nh,nl)}</div>
    <div class="hm"><div class="k"><span>Up 4%+ / down 4%+</span><b class="num"><span class="up">${u4}</span> / <span class="down">${d4}</span></b></div>${split(u4,d4)}</div>
    <div class="hm"><div class="k"><span>Pass Minervini trend template</span><b class="num">${tt} <span style="color:var(--band-muted);font-weight:500;font-size:15px">(${(tt/m.universe*100).toFixed(1)}%)</span></b></div><div class="meter"><i style="width:${Math.min(100,tt/m.universe*100)}%"></i></div></div>
  </div>`;
}
function renderFoot(){
  const m=D.meta,f=m.filters||{};
  $("#foot").innerHTML=`<p>Breadth and rotation: ${m.all_stocks?`all ${m.all_stocks.toLocaleString("en-IN")} NSE main-board stocks that traded in the last 3 sessions (no liquidity filter), or the liquid universe with the switch. `:""}Scanners and RS ranking: ${m.universe.toLocaleString("en-IN")} liquid NSE stocks (price ≥ ₹${f.min_price}, median daily turnover ≥ ₹${f.min_median_turnover_cr} Cr${f.min_market_cap_cr?`, market cap ≥ ₹${f.min_market_cap_cr} Cr`:""}). Prices from ${m.source==="upstox"?"Upstox (split- and bonus-adjusted), with today's candle checked against the NSE bhavcopy":m.source==="yahoo"?"Yahoo Finance (backup source)":esc(m.source)}. Refreshed every weekday evening.</p><p>For personal research. Not investment advice.${D.meta.grp?` Group charts by <a href="https://www.tradingview.com/" target="_blank" rel="noopener">TradingView</a> Lightweight Charts™ (Apache 2.0).`:""}</p>`;

/* ════════════════════ generic table ════════════════════ */
const TBL={};
function dtable(id,rows,cols,{limit=100,empty="Nothing to show.",csv=true}={}){
  const T=st.tbl[id]||(st.tbl[id]={key:null,dir:-1,show:limit});
  if(!rows.length)return `<div class="empty">${esc(empty)}</div>`;
  let data=rows;
  if(T.key){const c=cols.find(c=>c.k===T.key);if(c){const f=c.sort||(r=>r[c.k]);data=[...rows].sort((a,b)=>{const A=f(a),B=f(b);if(A==null||A==="")return 1;if(B==null||B==="")return -1;return typeof A==="string"?T.dir*A.localeCompare(B):T.dir*(A-B)})}}
  const vis=data.slice(0,T.show);
  let h=`<div class="tscroll"><table class="dt" data-tid="${esc(id)}"><thead><tr>${cols.map(c=>`<th class="${c.l?"l":""}" data-k="${esc(c.k)}" tabindex="0" aria-sort="${T.key===c.k?(T.dir<0?"descending":"ascending"):"none"}">${esc(c.label)}${T.key===c.k?(T.dir<0?" ▼":" ▲"):""}</th>`).join("")}</tr></thead><tbody>`;
  for(const r of vis)h+="<tr>"+cols.map(c=>`<td class="${c.l?"l ":""}${c.td?c.td(r):""}">${c.fmt?c.fmt(r):esc(r[c.k]??"–")}</td>`).join("")+"</tr>";
  h+=`</tbody></table></div><div class="tfoot"><span>${rows.length.toLocaleString("en-IN")} rows${rows.length>T.show?` · showing ${T.show}`:""}</span><span>`;
  if(rows.length>T.show)h+=`<button class="ghost" type="button" data-more="${esc(id)}">Show ${Math.min(100,rows.length-T.show)} more</button> `;
  if(csv)h+=`<button class="ghost" type="button" data-csv="${esc(id)}">Download CSV</button>`;
  h+=`</span></div>`;
  TBL[id]={rows:data,cols};
  return h;
}
function wireTables(root,rerender){
  root.querySelectorAll("table.dt").forEach(t=>{const id=t.dataset.tid;
    t.querySelectorAll("th[data-k]").forEach(th=>{const go=()=>{const T=st.tbl[id];const k=th.dataset.k;T.dir=T.key===k?-T.dir:-1;T.key=k;rerender()};th.addEventListener("click",go);th.addEventListener("keydown",e=>{if(e.key==="Enter")go()})})});
  root.querySelectorAll("[data-more]").forEach(b=>b.addEventListener("click",()=>{st.tbl[b.dataset.more].show+=100;rerender()}));
  root.querySelectorAll("[data-csv]").forEach(b=>b.addEventListener("click",()=>downloadCsv(b.dataset.csv)));
}
function downloadCsv(id){
  const {rows,cols}=TBL[id];const strip=h=>String(h).replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
  const q=v=>{v=v==null?"":String(v);return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v};
  const val=(c,r)=>c.csv?c.csv(r):c.sort?c.sort(r):r[c.k]!==undefined?r[c.k]:c.fmt?strip(c.fmt(r)):"";
  const lines=[cols.map(c=>q(c.label)).join(",")].concat(rows.map(r=>cols.map(c=>q(val(c,r))).join(",")));
  const blob=new Blob([lines.join("\n")],{type:"text/csv"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${id}_${D.meta.asof}.csv`;document.body.appendChild(a);a.click();a.remove();
}
const gcap=v=>isNum(v)&&v>=999?"≥999%":sgn(v,0);
const C={
  stock:{k:"s",label:"Stock",l:1,fmt:r=>symBtn(r.s,r.n),sort:r=>r.s},

  rs4w:{k:"rs4w",label:"RS 4W ago",fmt:r=>rsPill(r.rs4w)},
  rs12w:{k:"rs12w",label:"RS 12W ago",fmt:r=>rsPill(r.rs12w)},
  rsfrom:{k:"rsfrom",label:"Coming from",l:1,fmt:r=>rsFromTxt(r),sort:r=>isNum(r.rs)?(r.rsdir?r.rs-r.rsfrom:0):null,

  rspath:{k:"rspath",label:"RS rating, 52 weeks",l:1,fmt:r=>rsSpark(r.s),sort:r=>r.rsmx,csv:r=>(RSH?.rows?.[r.s]?.h||[]).join(" ")},

/* ════════════════════ ROTATION ════════════════════ */
function groupStats(prev,period=st.period,group=st.group){

  for(const [name,syms] of Object.entries(g)){
    const live=syms.filter(s=>D.by[s]&&inUni(s));
    const pairs=live.map(s=>[s,D.by[s][key]?.[period]]).filter(([,v])=>isNum(v));
    if(pairs.length<(D.meta.min_group_size||3))continue;
    const vals=pairs.map(p=>p[1]),a50=live.filter(s=>D.by[s].a50!=null);
    out.push({name,n:vals.length,v:st.agg==="mean"?mean(vals):median(vals),adv:vals.filter(v=>v>0).length/vals.length*100,
      br:a50.length?a50.filter(s=>D.by[s].a50).length/a50.length*100:null,syms:live,top:[...pairs].sort((a,b)=>b[1]-a[1]).slice(0,2)});
  }

}

/* Scanner search: every typed word must start a word somewhere in the scanner's name, group or write-up

const wordsOf=t=>String(t||"").toLowerCase().split(/[^a-z0-9%×]+/).filter(Boolean);
function scanIdx(x){if(!x._w){const d=x.doc||{};x._n=wordsOf(x.name+" "+x.cat);x._w=new Set([...x._n,...wordsOf([x.desc,x.metric,d.what,d.use,d.watch,d.src,...(d.rules||[])].join(" "))])}return x}
const SCAN_SYN={eps:["eps","earnings"],pat:["pat","profit"],profit:["profit","earnings"],sales:["sales","revenue"],revenue:["revenue","sales"],

function scanScore(x,qs){scanIdx(x);let sc=0;for(const w of qs){const alts=SCAN_SYN[w]||[w],hit=t=>alts.some(a=>t.startsWith(a));
  if(x._n.some(hit))sc+=3;else if([...x._w].some(hit))sc+=1;else return 0}return sc}
function scanMatches(q,ranked){const S=D.scans,qs=wordsOf(q);if(!qs.length)return S.meta;
  const r=S.meta.map((x,i)=>[x,scanScore(x,qs),i]).filter(a=>a[1]>0);if(ranked)r.sort((a,b)=>b[1]-a[1]||a[2]-b[2]);return r.map(a=>a[0])}

      return `<button type="button" data-scan="${x.id}" style="--g:${gcol(x.cat)}" aria-current="${x.id===m.id}"><span>${esc(x.name)}</span><span class="c ${n?"":"z"}">${n}</span></button>`}).join("")}).join("");

}
function scanDoc(m){

function renderScanners(){

  if(!D.scanMeta[st.scan])st.scan=S.meta[0].id;

  let rows=hits.map(s=>D.by[s]).filter(Boolean);const metric=S.metric?.[m.id]||{};

  if(st.scanFund){const before=rows.length;rows=rows.filter(r=>(r.fr??0)>=st.scanFund);topNote=`${rows.length} of ${before} stocks have a Fund rating of ${st.scanFund}+. `}

  const cols=[C.stock,C.px,C.mc,C.ret("1D")];
  const DUP={"Day %":"r.1D","Vol ×":"vr","From 52wH %":"h52","Close range %":"dcr","ADR %":"adr","Profit YoY %":"pat_yoy","P/E":"pe","Net bought ₹Cr":"mfn","Net sold ₹Cr":"mfn","Months in a row":"mfst"},dup=DUP[m.metric];

  <div class="scan-layout"><aside class="card rail-wrap" id="scanWrap"><div class="rail-search"><input class="search" type="search" id="scanQ" placeholder="Find a scanner: EMA, volume…" value="${esc(st.scanQ)}" aria-label="Find a scanner" autocomplete="off"><span id="scanQn" class="note"></span></div>

    <h3>${esc(m.name)}</h3><p>${esc(m.desc)}${m.cat==="Fund flows"&&D.meta.mf?` <button type="button" class="linkbtn" style="padding:0 2px;font-size:inherit" data-seg="scanView" data-val="mf">Open the full Fund flows table</button>`:""}</p>${scanDoc(m)}

  ${rows.length?`<div class="ctl"><span>&nbsp;</span><button type="button" class="ghost" data-wl-addall="${esc(JSON.stringify(rows.map(r=>r.s)))}" data-label="${esc(m.name)} stocks">☆ Add all ${rows.length} to a watchlist</button></div>`:""}</div>${topNote?`<p class="note" style="margin:8px 0 0">${esc(topNote)}</p>`:""}</div>
  <div id="scanT">${dtable(tid,rows,cols,{empty:"No stocks triggered this scan today."})}</div></section></div>`;
  drawRail();
  wireTables($("#scanT"),renderScanners);
  $("#scanSel").addEventListener("change",e=>{st.scan=e.target.value;store.set("scan2",st.scan);renderScanners()});

  q.addEventListener("keydown",e=>{if(e.key==="Enter"){const f=scanMatches(st.scanQ,true)[0];if(f){st.scan=f.id;store.set("scan2",f.id);renderScanners();$("#scanQ")?.focus()}}if(e.key==="Escape"){st.scanQ="";renderScanners()}});

/* ════════════════════ LONG BASES ════════════════════
   bases.json (scripts/bases.py): one row per stock = its longest daily base.
   len = trading days in the base, piv = pivot (highest close inside it), fl = lowest close,
   st = status vs the pivot, ib = a breakout from a shorter base inside it (last 20 sessions). */
let BASES=null;
async function basesLoad(){
  if(!BASES){if(window.EMBED?.bases)BASES=window.EMBED.bases;
    else{if(!D.meta.bases)return null;try{const r=await fetch(`data/bases.json?v=${Date.now()}`);BASES=r.ok?await r.json():null}catch(e){BASES=null}}
    if(BASES)BASES.by=Object.fromEntries(BASES.rows.map(x=>[x.s,x]))}

const bdur=n=>n>=250?`${(n/250).toFixed(1)} yrs`:n>=42?`${Math.round(n/21)} months`:`${Math.round(n/5)} weeks`;
const bmon=d=>{const t=new Date(String(d).slice(0,10)+"T00:00:00");return isNaN(t)?"":t.toLocaleDateString("en-IN",{month:"short",year:"numeric"})};
const bFromPiv=b=>b.st==="bo0"||b.st==="bo"||b.st==="ext"?b.ext:isNum(b.dist)?(1/(1+b.dist/100)-1)*100:null;  // price vs pivot, %
const BST={bo0:["Breakout today","p-up"],bo:["Breakout","p-up"],tb:["Back at the pivot","p-acc"],ext:["Extended","p-acc"],near:["Near pivot","p-acc"],w15:["5–15% below","p-mut"],in:["In base","p-mut"]};
const BORDER={bo0:0,bo:1,near:2,ext:3,w15:4,in:5};
function bStatus(b,long){
  const tb=b.st==="bo"&&b.ext<0,[lab,c]=BST[tb?"tb":b.st]||["–","p-mut"],fp=bFromPiv(b);
  let h=`<span class="pill ${c}">${esc(tb?lab:b.st==="bo"?`Breakout ${b.ago}d ago`:lab)}</span>`;
  if(tb)h+=`<span class="bsub">Broke out ${b.ago}d ago, now testing the pivot from above (throwback)</span>`;
  if(long)h+=` <span class="num" style="font-weight:700">${b.st==="bo0"||b.st==="bo"||b.st==="ext"?sgn(b.ext,1)+" above pivot":sgn(fp,1)+" from pivot"}</span>`;
  if(b.ib)h+=`<span class="bsub">${b.ib.ago===0?"Today":b.ib.ago+"d ago"}: broke out of a ${b.ib.len}-day base inside it (₹${inr(b.ib.piv)})</span>`;
  return h}
const bInner=b=>b.ib&&b.ib.len>=100&&b.ib.ext<=5;   // a long-base breakout inside an even longer base
function scorePill(v){if(!isNum(v))return "–";const c=v>=80?"rs-a":v>=70?"rs-b":v>=55?"rs-c":"rs-d";return `<span class="rs ${c}">${v}</span>`}
function bchart(s,big,wpx){
  const ch=BASES?.charts?.[s],b=BASES?.by?.[s];if(!ch||!b)return "–";
  const c=ch.c,n=c.length;if(n<3)return "–";
  const W=big?Math.max(320,Math.min(900,(wpx||460)-12)):156,H=big?Math.round(Math.min(300,Math.max(220,W*.45))):48,pl=big?58:2,pr=big?8:2,pt=big?14:4,pb=big?28:4;
  const v=c.filter(isNum);let lo=Math.min(...v,b.fl),hi=Math.max(...v,b.piv);if(isNum(b.tgt)&&big&&b.tgt<hi*1.25)hi=Math.max(hi,b.tgt);const pad=(hi-lo)*.07;lo-=pad;hi+=pad;
  const x=i=>pl+i*(W-pl-pr)/(n-1),y=t=>pt+(1-(t-lo)/(hi-lo))*(H-pt-pb);
  const e=ch.b!=null?ch.b-1:n-1;
  let g="";
  if(big){for(let k=0;k<=3;k++){const t=lo+(hi-lo)*k/3;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--track)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${t>=1000?Math.round(t).toLocaleString("en-IN"):t.toFixed(t>=100?0:1)}</text>`}
    g+=`<text x="${x(ch.s)}" y="${H-8}" text-anchor="${ch.s<n*.15?"start":"middle"}">${esc(bmon(b.start))}</text><text x="${W-pr}" y="${H-8}" text-anchor="end">${esc(fmtDate(D.meta.asof))}</text>`}
  g+=`<rect class="box" x="${x(ch.s)}" y="${y(b.piv)}" width="${Math.max(1,x(e)-x(ch.s))}" height="${Math.max(1,y(b.fl)-y(b.piv))}"/>`;
  if(ch.ibp!=null&&ch.ibs!=null)g+=`<line x1="${x(ch.ibs)}" x2="${x(ch.ib)}" y1="${y(ch.ibp)}" y2="${y(ch.ibp)}" stroke="var(--s2)" stroke-width="${big?1.8:1.3}"/>`;
  g+=`<line x1="${x(ch.s)}" x2="${W-pr}" y1="${y(b.piv)}" y2="${y(b.piv)}" stroke="var(--accent-ink)" stroke-width="${big?2:1.5}" stroke-dasharray="${big?"7 4":"4 3"}"/>`;
  if(big){g+=`<text x="${pl+6}" y="${y(b.piv)-6}" style="fill:var(--accent-ink);font-weight:700">Pivot ${inr(b.piv)}</text><text x="${pl+6}" y="${y(b.fl)+17}" style="font-weight:700">Base low ${inr(b.fl)}</text>`;
    if(isNum(b.tgt)&&b.tgt<=hi)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(b.tgt)}" y2="${y(b.tgt)}" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="2 4"/><text x="${W-pr-4}" y="${y(b.tgt)-6}" text-anchor="end">Measured move ${inr(b.tgt)}</text>`}
  g+=`<polyline points="${c.map((t,i)=>isNum(t)?`${x(i).toFixed(1)},${y(t).toFixed(1)}`:null).filter(Boolean).join(" ")}" fill="none" stroke="var(--s1)" stroke-width="${big?2:1.5}" stroke-linejoin="round"/>`;
  if(ch.b!=null)g+=`<circle cx="${x(ch.b)}" cy="${y(c[ch.b])}" r="${big?5.5:3.2}" fill="var(--up)" stroke="var(--card)" stroke-width="2"/>`;
  else if(ch.ib!=null)g+=`<circle cx="${x(ch.ib)}" cy="${y(c[ch.ib])}" r="${big?5:3}" fill="var(--s2)" stroke="var(--card)" stroke-width="2"/>`;
  return `<svg class="bch${big?" big":""}" viewBox="0 0 ${W} ${H}" ${big?'style="width:100%;height:auto"':`width="${W}" height="${H}"`} role="img" aria-label="${esc(s)}: ${b.len}-day base since ${esc(bmon(b.start))}, pivot ${inr(b.piv)}, low ${inr(b.fl)}">${g}</svg>`}
function bJoin(b){const x=D.by[b.s]||{};return {s:b.s,n:x.n,rs:x.rs,fr:x.fr,mc:x.mc,sec:x.sec,ind:x.ind,stage:x.st,px:x.px,b}}
const BCOL={
  len:{k:"len",label:"Base days",fmt:r=>`<span class="bdays num">${r.b.len.toLocaleString("en-IN")}${r.b.cap?"+":""}</span><span class="bsub">${bdur(r.b.len)} · from ${esc(bmon(r.b.start))}${r.b.lst?" (listing)":""}${r.b.cap?" (data limit)":""}</span>`,sort:r=>r.b.len,csv:r=>r.b.len},
  ch:{k:"ch",label:"Base (shaded) and pivot",l:1,fmt:r=>bchart(r.s),sort:r=>r.b.len,csv:r=>r.b.start},
  st:{k:"bst",label:"Status",l:1,fmt:r=>bStatus(r.b),sort:r=>BORDER[r.b.st]*1000-(r.b.len/10),csv:r=>(BST[r.b.st]||[""])[0]+(r.b.ib?` / inner breakout ${r.b.ib.len}d`:"")},
  fp:{k:"fp",label:"From pivot",fmt:r=>{const v=bFromPiv(r.b);return `<span class="num ${v>=0?"up":""}" style="font-weight:700">${sgn(v,1)}</span>`},sort:r=>bFromPiv(r.b)},
  piv:{k:"piv",label:"Pivot ₹",fmt:r=>`<span class="num">${inr(r.b.piv)}</span>`,sort:r=>r.b.piv},
  depth:{k:"depth",label:"Depth %",fmt:r=>`<span class="num">${isNum(r.b.depth)?r.b.depth.toFixed(0):"–"}</span>`,sort:r=>r.b.depth},
  sc:{k:"sc",label:"Base Score",fmt:r=>scorePill(r.b.sc),sort:r=>r.b.sc},
  type:{k:"type",label:"Built after",l:1,fmt:r=>r.b.type==="C"?"an advance":`a decline`,sort:r=>r.b.type},
  tc:{k:"tc",label:"Pivot tests",fmt:r=>`<span class="num">${r.b.tc}</span>`,sort:r=>r.b.tc},
  tight:{k:"tight",label:"Last 15d range %",fmt:r=>`<span class="num">${isNum(r.b.tight)?r.b.tight.toFixed(1):"–"}</span>`,sort:r=>r.b.tight},
  dry:{k:"dry",label:"Vol 10d ÷ base",fmt:r=>`<span class="num">${isNum(r.b.dry)?r.b.dry.toFixed(2):"–"}</span>`,sort:r=>r.b.dry},
  tgt:{k:"tgt",label:"Measured move ₹",fmt:r=>`<span class="num">${inr(r.b.tgt)}</span> <span class="bsub" style="display:inline">${isNum(r.b.tgt)&&isNum(r.px)?sgn((r.b.tgt/r.px-1)*100,0):""}</span>`,sort:r=>isNum(r.b.tgt)&&isNum(r.px)?r.b.tgt/r.px:null,csv:r=>r.b.tgt},
};
if(!st.bx)st.bx={q:"",status:"act",min:"100",depth:"0",score:"0",type:"all",s2:false,rs70:false,f60:false};
function bFilter(rows){
  const f=st.bx,q=f.q.trim().toUpperCase(),min=+f.min,dep=+f.depth,sc=+f.score;
  return rows.filter(b=>{const x=D.by[b.s]||{};
    if(q&&!b.s.includes(q)&&!String(x.n||"").toUpperCase().includes(q))return false;
    if(f.status==="act"&&!["bo0","bo","near","w15"].includes(b.st))return false;
    if(f.status==="bo"&&!(["bo0","bo","ext"].includes(b.st)||bInner(b)))return false;
    if(["near","w15","in"].includes(f.status)&&b.st!==f.status)return false;
    if(b.len<min)return false;if(dep&&!(b.depth<=dep))return false;if(sc&&!(b.sc>=sc))return false;
    if(f.type!=="all"&&b.type!==f.type)return false;
    if(f.s2&&x.st!==2)return false;if(f.rs70&&!((x.rs??0)>=70))return false;if(f.f60&&!((x.fr??0)>=60))return false;
    return true})}
function bEvidence(E){

  const mx=Math.max(...E.len_quality.map(r=>r.avg),...E.len_other.map(r=>r.avg),...E.score_all.map(r=>r.avg),1);
  const oth=Object.fromEntries(E.len_other.map(r=>[r.label,r]));
  const t1=`<div class="tscroll"><table class="dt etab"><thead><tr><th class="l">Base length (trading days)</th><th class="l">Avg 1 yr vs NIFTY 500</th><th>Median</th><th>Beat the index</th><th>Failed</th><th>Doubled</th><th>Breakouts</th><th class="l">Not in an uptrend: avg</th><th>Beat</th></tr></thead><tbody>`+
    E.len_quality.map(r=>{const o=oth[r.label]||{};return `<tr><td class="l"><b>${esc(r.label)}</b></td><td class="l">${bar(r.avg,mx)}</td><td class="num">${sgn(r.med,1)}</td><td class="num">${r.win.toFixed(0)}%</td><td class="num">${r.fail.toFixed(0)}%</td><td class="num">${r.big.toFixed(0)}%</td><td class="num">${r.n.toLocaleString("en-IN")}</td><td class="l">${bar(o.avg,mx)}</td><td class="num">${isNum(o.win)?o.win.toFixed(0)+"%":"–"}</td></tr>`}).join("")+`</tbody></table></div>`;
  const late=Object.fromEntries(E.score_late.map(r=>[r.label,r])),all=Object.fromEntries(E.score_all.map(r=>[r.label,r]));
  const t2=`<div class="tscroll"><table class="dt etab"><thead><tr><th class="l">Base Score</th><th class="l">Avg 1 yr vs NIFTY 500, 2007–16</th><th class="l">Same, 2017–26</th><th>Median</th><th>Beat the index</th><th>Failed</th><th>Breakouts</th></tr></thead><tbody>`+

      <p class="note">${R.weeks} weekly snapshot(s) so far.</p>`;
      if(R.rot_in||R.rot_out)h+=`<div class="cols2"><div class="card pad"><h3 style="font-size:19px">🚀 Rotating in</h3>${(R.rot_in||[]).map(([s,v])=>`<div class="hbar"><span>${esc(s)}</span><span></span><b class="up num" style="text-align:right">+${v}</b></div>`).join("")||"–"}</div><div class="card pad"><h3 style="font-size:19px">🪂 Rotating out</h3>${(R.rot_out||[]).map(([s,v])=>`<div class="hbar"><span>${esc(s)}</span><span></span><b class="down num" style="text-align:right">${v}</b></div>`).join("")||"–"}</div></div>`}
  }
  box.innerHTML=h;wireTables(box,vpTab);wireVtools();
}

/* ════════════════════ FUND FLOWS (Scanners → Fund flows) ════════════════════
   mf.json (scripts/mf_flows.py): what ACTIVE mutual funds bought, stock by stock, from every scheme's month-end
   portfolio, month against month (share counts, same scheme in both months).

   nb/ns schemes buying/selling, ab/as fund houses, nn/nx new/exited schemes, h/ha schemes/fund houses holding,
   v ₹ held by active funds, va ₹ held by all schemes, pct % of the company held by all schemes, st buying streak,

function mfHero(M){
  const A=(M.meta.audit||[]).slice(-12);if(!A.length)return "";
  const vals=A.map(a=>a.active_net),ipo=A.map(a=>Math.max(0,a.left_out?.new_listings||0));

  const L=A[A.length-1];
  return `<div class="card mfhero"><h3>Active funds' net buying of Indian stocks, ₹ Cr each month</h3>
    <p class="sub">${esc(ymL(L.m,true))}: <b class="${cls(L.active_net)}">${mfCr(L.active_net)} Cr</b> net bought across ${L.active_schemes} active schemes of ${L.fund_houses} fund houses read in both months${L.active_equity_cr?`, which hold ₹${(L.active_equity_cr/1e5).toFixed(1)} lakh Cr of stocks`:""}. A month's total depends on how many fund houses could be read for it — compare stock by stock, not month totals.</p>

function mfHow(M){
  const c=M.meta.checks,ex=M.meta.fund_houses||{},cov=M.meta.coverage_latest?.amcs||[];
  return `<details class="card evid"${store.get("mfHow",false)?" open":""}><summary>How this is counted <span>— and how it was checked</span></summary><div class="evb">
    <ul class="fl">
      <li><b>Source:</b> every fund house publishes each scheme's full portfolio for the last day of the month (SEBI rule, within 10 days). This site reads ${Object.keys(ex).length} fund houses' files; ${cov.length} were read completely for both of the last two months.</li>
      <li><b>Shares, not rupees.</b> A holding's value moves with the price; the number of shares changes only when the fund trades. Net buying = change in shares × the month's average price.</li>
      <li><b>Same scheme, both months.</b> A scheme counts only when it is in both months' files (matched by name, or by an almost identical portfolio when it was renamed). A file that failed to download can never look like a sale.</li>
      <li><b>Bonus issues and splits</b> are put on today's share basis using the price in the file itself, so a 1:1 bonus is not read as every fund buying.</li>
      <li><b>Left out:</b> new schemes investing their NFO money (first two months after allotment, from AMFI's dates), a scheme whose money more than doubles in a month (a merger into it), and IPO allotments in the month a stock lists.</li>
      <li><b>Active funds only</b> in the table and scanners. Index funds and ETFs (they buy whatever money comes in), arbitrage funds and hedged hybrids (balanced advantage, equity savings, multi-asset) are shown separately in each stock's window.</li>

    <p class="note">Portfolios are a month-end snapshot published up to 10 days later, so this shows what funds did, not what they are doing today. Fund houses not read: ${esc(M.meta.missing||"see the list on GitHub")}.</p></div></details>`}
function mfEvidence(M){
  const E=M.meta.evidence;if(!E||!E.rows?.length)return "";
  const all=E.all,cell=(o,b)=>!o||o.avg==null?`<td class="num">–</td><td class="num">–</td>`:`<td class="l"><span class="ebar${o.avg<0?" neg":""}" style="width:${Math.max(2,Math.min(80,Math.abs(o.avg)*8))}px"></span><span class="num" style="font-weight:700">${sgn(o.avg,1)}</span>${b?` <span class="bsub" style="display:inline">(all ${sgn(b.avg,1)})</span>`:""}</td><td class="num">${o.win}%</td>`;
  const top=E.rows[0],bot=E.rows[E.rows.length-1];

      <li><b>${verdict}</b> This is only ${top.r1?.months||0} months of data in one market phase; the table updates itself every month. Use fund buying as context alongside price, RS and results — not as a buy signal on its own.</li></ul>

function itemStats(it){
  const s=it.s,x=D.by[s],px=pxOf(s),bn=benchPx(),m=wlGet().meta[s]||{};
  const o={since:isNum(px)&&isNum(it.p)&&it.p>0?(px/it.p-1)*100:null};
  o.bret=isNum(bn)&&isNum(it.b)&&it.b>0?(bn/it.b-1)*100:null;
  o.alpha=isNum(o.since)&&isNum(o.bret)?o.since-o.bret:null;
  o.days=Math.max(0,Math.round((new Date(D.meta.asof+"T00:00:00")-new Date(it.d+"T00:00:00"))/864e5));
  const c=CL?.c?.[s];
  if(c&&isNum(it.p)){const i0=Math.max(0,clIdx(it.d));const seg=c.slice(i0).filter(isNum);if(seg.length){o.maxg=(Math.max(...seg)/it.p-1)*100;o.maxdd=(Math.min(...seg)/it.p-1)*100}}
  if(isNum(px)){
    if(isNum(m.pivot)&&m.pivot>0)o.fromPiv=(px/m.pivot-1)*100;
    if(isNum(m.stop)&&m.stop>0)o.toStop=(px/m.stop-1)*100;
    if(isNum(m.target)&&m.target>0)o.toTgt=(m.target/px-1)*100;
  }
  o.setup=setupOf(px,m,o);
  return o;
}
function setupOf(px,m,o){
  if(isNum(o.toStop)&&o.toStop<0)return{k:"stop",t:"Below stop"};
  if(isNum(o.toTgt)&&o.toTgt<=0)return{k:"tgt",t:"Target hit"};
  if(!isNum(o.fromPiv))return null;
  if(o.fromPiv<-3)return{k:"below",t:`${Math.abs(o.fromPiv).toFixed(1)}% below pivot`};
  if(o.fromPiv<0)return{k:"near",t:`Near pivot (${o.fromPiv.toFixed(1)}%)`};
  if(o.fromPiv<=5)return{k:"zone",t:`Buy zone +${o.fromPiv.toFixed(1)}%`};
  return{k:"ext",t:`Extended +${o.fromPiv.toFixed(1)}%`};
}

const BULL_SCANS=["combo3","up4","high52_dcr","ath","vcp","pocket_pivot","tight3w","power3","bgu","episodic_pivot","darvas","stage2_bo","bull_snort","wedge_pop","f_post","f_accel","lb_breakout","lb_near","s2_early","res_strong","rs_bluedot","dlv_quiet"];
const BEAR_SCANS=["down4","leader_down","below200","ema_down","death","gap_down","f_red","rs_fade","dlv_dist"];
function sma50(c,i){if(!c||i<49)return null;let t=0;for(let k=i-49;k<=i;k++){if(!isNum(c[k]))return null;t+=c[k]}return t/50}
function wlAlerts(syms){
  const out=[],w=wlGet(),asof=D.meta.asof;
  for(const s of syms){
    const x=D.by[s],px=pxOf(s),m=w.meta[s]||{},lists=wlListsOf(s).map(l=>l.name).join(", ");
    const add=(lvl,txt,rank)=>out.push({s,lvl,txt,rank,lists});
    const prev=x&&isNum(x.r?.["1D"])?px/(1+x.r["1D"]/100):null;
    if(isNum(px)&&isNum(m.stop)){if(px<m.stop)add("crit",isNum(prev)&&prev>=m.stop?`Closed below your stop ₹${inr(m.stop)} today`:`Below your stop ₹${inr(m.stop)} (${((px/m.stop-1)*100).toFixed(1)}%)`,0);
      else if(px/m.stop-1<=.03)add("warn",`Within ${((px/m.stop-1)*100).toFixed(1)}% of your stop ₹${inr(m.stop)}`,2)}
    if(isNum(px)&&isNum(m.target)&&px>=m.target)add("good",`Reached your target ₹${inr(m.target)}`,3);
    if(isNum(px)&&isNum(m.pivot)){const fp=(px/m.pivot-1)*100;
      if(isNum(prev)&&prev<=m.pivot&&px>m.pivot)add("good",`Broke out above your pivot ₹${inr(m.pivot)}${isNum(x?.vr)?` on ${x.vr.toFixed(1)}× volume`:""}`,1);
      else if(fp>=0&&fp<=5)add("good",`In the buy zone, +${fp.toFixed(1)}% above pivot ₹${inr(m.pivot)}`,4);
      else if(fp<0&&fp>=-3)add("info",`${Math.abs(fp).toFixed(1)}% below your pivot ₹${inr(m.pivot)} — get ready`,5)}
    const bad=(D.scansOf[s]||[]).filter(id=>BEAR_SCANS.includes(id)).map(id=>D.scanMeta[id]?.name).filter(Boolean);
    if(bad.length)add("warn",`Warning: ${bad.join(", ")}`,2);
    const good=(D.scansOf[s]||[]).filter(id=>BULL_SCANS.includes(id)).map(id=>D.scanMeta[id]?.name).filter(Boolean);
    if(good.length)add("good",`In today's scans: ${good.join(", ")}`,6);
    if(x&&isNum(x.rs)&&isNum(x.rs1w)&&x.rs<70&&x.rs1w>=70)add("warn",`RS rating fell to ${x.rs} (was ${x.rs1w} a week ago)`,7);
    const c=CL?.c?.[s];if(c&&c.length>51){const i=c.length-1,a=sma50(c,i),b=sma50(c,i-1);
      if(isNum(a)&&isNum(b)&&c[i]<a&&c[i-1]>=b)add("warn","Closed below its 50-day average today",3);
      if(isNum(a)&&isNum(b)&&c[i]>a&&c[i-1]<=b)add("info","Closed back above its 50-day average",8)}
    if(x?.next_results){const dd=Math.round((new Date(x.next_results+"T00:00:00")-new Date(asof+"T00:00:00"))/864e5);
      if(dd>=0&&dd<=7)add("info",`Results on ${new Date(x.next_results+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})} (${dd===0?"today":dd===1?"tomorrow":"in "+dd+" days"}) — decide before, not after`,9)}
    const v=VPX?.[s];if(v&&/FRESH/.test(v.status||""))add("good","Fresh VPCI buy signal this week",6);
    for(const r of (CAD?.by?.[s]||[])){const dd=Math.round((new Date(r.ex+"T00:00:00")-new Date(asof+"T00:00:00"))/864e5);
      if(dd>=0&&dd<=7)add("info",`${r.label} — ex-date ${new Date(r.ex+"T00:00:00").toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}${r.kind==="split"||r.kind==="bonus"?" (price will adjust)":""}`,9)}
  }
  const ord={crit:0,warn:1,good:2,info:3};
  return out.sort((a,b)=>ord[a.lvl]-ord[b.lvl]||a.rank-b.rank||a.s.localeCompare(b.s));
}
function updateWlBadge(){const el=$("#wlCnt");if(!el||!D.by)return;const a=wlAlerts(wlAllSyms()).filter(x=>x.lvl==="crit"||x.lvl==="good"&&x.rank<=1);el.textContent=a.length?String(new Set(a.map(x=>x.s)).size):"";el.title=a.length?"Stocks needing attention":""}

function parseSyms(text){const known=s=>D.by[s]||VPX?.[s];const ok=[],bad=[];

    (known(t)?ok:bad).push(t)}return{ok:[...new Set(ok)],bad:[...new Set(bad)]}}

/* ── sync between devices: secret GitHub gist ── */
const GH="https://api.github.com",GFILE="pkc-radar-watchlists.json";
const syncCfg={get(){return store.get("wlsync",null)},set(v){store.set("wlsync",v)}};
async function gh(path,opt,tok){const r=await fetch(GH+path,{method:opt?.method||"GET",body:opt?.body,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+tok,...(opt?.body?{"Content-Type":"application/json"}:{})}});
  if(!r.ok)throw new Error(r.status===401?"GitHub refused the token (401). Check it has the gist permission.":`GitHub error ${r.status}`);return r.json()}
function wlMerge(a,b){ // first connect on a device that already has lists: keep everything from both
  const newer=(a.updated||0)>=(b.updated||0)?a:b,older=newer===a?b:a,out=wlNorm(JSON.parse(JSON.stringify(newer)));
  for(const L of older.lists){let T=out.lists.find(x=>x.name.trim().toLowerCase()===L.name.trim().toLowerCase());if(!T){T={id:wlNewId(),name:L.name,items:[]};out.lists.push(T)}
    for(const it of L.items){const e=T.items.find(i=>i.s===it.s);if(!e)T.items.push({...it});else if(it.d<e.d)Object.assign(e,it)}}
  for(const [k,v] of Object.entries(older.meta||{}))if(!out.meta[k])out.meta[k]=v;
  const seen=new Set(out.log.map(e=>e.s+e.d+e.o));for(const e of older.log||[])if(!seen.has(e.s+e.d+e.o))out.log.push(e);
  out.updated=Date.now();return out}
async function syncConnect(tok){const w=wlGet();const mine=await gh("/gists?per_page=100",null,tok);let g=mine.find(x=>x.files&&x.files[GFILE]);
  if(g){const full=await gh("/gists/"+g.id,null,tok);let remote=null;try{remote=JSON.parse(full.files[GFILE].content)}catch(e){}
    const localHas=w.lists.some(l=>l.items.length),remoteHas=remote&&Array.isArray(remote.lists)&&remote.lists.some(l=>l.items?.length);
    WL=localHas&&remoteHas?wlMerge(w,wlNorm(remote)):remoteHas?wlNorm(remote):w;wlSave(true);
    await gh("/gists/"+g.id,{method:"PATCH",body:JSON.stringify({files:{[GFILE]:{content:JSON.stringify(WL)}}})},tok)}
  else g=await gh("/gists",{method:"POST",body:JSON.stringify({description:"PKC Sector Radar watchlists",public:false,files:{[GFILE]:{content:JSON.stringify(w)}}})},tok);
  syncCfg.set({tok,id:g.id,at:Date.now(),err:null})}
async function syncPull(){const c=syncCfg.get();if(!c)return;try{const full=await gh("/gists/"+c.id,null,c.tok);const remote=JSON.parse(full.files[GFILE]?.content||"null");
    if(remote&&(remote.updated||0)>(wlGet().updated||0)){WL=wlNorm(remote);wlSave(true);if(st.tab==="watch")renderWatch();toast("Watchlists updated from your other device")}
    c.at=Date.now();c.err=null}catch(e){c.err=e.message}syncCfg.set(c)}
let syncT=null;
function syncPushSoon(){const c=syncCfg.get();if(!c)return;clearTimeout(syncT);syncT=setTimeout(async()=>{try{await gh("/gists/"+c.id,{method:"PATCH",body:JSON.stringify({files:{[GFILE]:{content:JSON.stringify(wlGet())}}})},c.tok);c.at=Date.now();c.err=null}catch(e){c.err=e.message;toast("Sync failed — saved on this device")}syncCfg.set(c)},1500)}
function syncDialog(){const c=syncCfg.get();
  modal(c?`<form><h3>Sync is on</h3><p>Your watchlists are saved to a private GitHub gist and kept the same on every device where you connect the same token. Last synced: ${c.at?new Date(c.at).toLocaleString("en-IN"):"–"}.${c.err?`<br><span class="err">${esc(c.err)}</span>`:""}</p>
      <p style="font-size:15px"><b>Telegram alerts:</b> save this same token as the <code>GIST_TOKEN</code> secret in your repository and the Telegram bot reads these lists — your pivot, stop and target levels — live during market hours (README → Telegram alerts).</p>
      <div class="acts"><button type="button" class="ghost" data-mclose>Close</button><button type="button" class="ghost" id="syncnow">Sync now</button><button class="btn danger" type="submit">Turn off on this device</button></div></form>`
    :`<form><h3>Sync across your devices</h3><p>Watchlists are saved in this browser. To see the same lists on your phone and PC, store them in a private GitHub gist (free, only you can change it):</p>
      <ol><li>Open <a href="https://github.com/settings/tokens/new?scopes=gist&description=PKC%20Sector%20Radar%20watchlists" target="_blank" rel="noopener">this GitHub page</a> (signed in as you). It creates a token that can only read and write gists. Choose an expiry, then click <b>Generate token</b>.</li>
      <li>Copy the token (starts with <code>ghp_</code>) and paste it below. Do the same on your other device.</li></ol>
      <input name="tok" placeholder="ghp_…" autocomplete="off" spellcheck="false" aria-label="GitHub token" required>
      <p style="font-size:14px">The token stays in this browser only. The gist is secret (not listed anywhere), but anyone given its exact address could read it — don't put anything private in notes.</p>
      <p class="err" id="syncerr" hidden></p>
      <div class="acts"><button type="button" class="ghost" data-mclose>Cancel</button><button class="btn" type="submit">Connect</button></div></form>`,
  async fd=>{if(c){syncCfg.set(null);toast("Sync turned off on this device");renderWatch();return}
    const tok=String(fd.get("tok")||"").trim();try{await syncConnect(tok);toast("Sync connected");renderWatch()}catch(e){const er=$("#syncerr");er.hidden=false;er.textContent=e.message;return false}});
  $("#syncnow")?.addEventListener("click",async()=>{await syncPull();syncPushSoon();modalClose();toast("Synced")})}

function historyHtml(){const w=wlGet();if(!w.log.length)return "";
  const rows=w.log.map((e,i)=>{const ret=isNum(e.po)&&isNum(e.p)&&e.p>0?(e.po/e.p-1)*100:null,br=isNum(e.bo)&&isNum(e.b)&&e.b>0?(e.bo/e.b-1)*100:null;
    return {i,s:e.s,n:nameOf(e.s),l:e.l,d:e.d,o:e.o,ret,alpha:isNum(ret)&&isNum(br)?ret-br:null,days:Math.max(0,Math.round((new Date(e.o+"T00:00:00")-new Date(e.d+"T00:00:00"))/864e5))}});
  const r=rows.filter(x=>isNum(x.ret)),win=r.filter(x=>x.ret>0).length,beat=r.filter(x=>isNum(x.alpha)&&x.alpha>0).length,avg=a=>a.length?a.reduce((p,q)=>p+q,0)/a.length:null;
  const dshort=d=>esc(new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"2-digit"}));
  const cols=[{k:"s",label:"Stock",l:1,fmt:x=>symBtn(x.s,x.n)},{k:"l",label:"List",l:1},{k:"d",label:"Added",fmt:x=>dshort(x.d)},{k:"o",label:"Removed",fmt:x=>dshort(x.o)},
    {k:"days",label:"Days"},{k:"ret",label:"Return",fmt:x=>`<span class="num ${cls(x.ret)}">${sgn(x.ret,1)}</span>`},{k:"alpha",label:"vs NIFTY",fmt:x=>`<span class="num ${cls(x.alpha)}">${sgn(x.alpha,1," pts")}</span>`}];
  if(!st.tbl.wlhist)st.tbl.wlhist={key:"o",dir:-1,show:50};
  return `<details class="card" style="margin-top:16px"><summary style="padding:14px 16px;font-weight:700;font-size:18px;cursor:pointer">Removed stocks &amp; your track record (${rows.length})</summary>
    <div class="track-rec"><span><b>${r.length?Math.round(win/r.length*100)+"%":"–"}</b> went up while on a list</span><span><b>${r.length?Math.round(beat/r.length*100)+"%":"–"}</b> beat ${esc(benchName())}</span><span><b>${sgn(avg(r.map(x=>x.ret)),1)}</b> average return</span><span><b>${sgn(avg(r.filter(x=>isNum(x.alpha)).map(x=>x.alpha)),1," pts")}</b> average vs index</span></div>
    ${dtable("wlhist",rows,cols,{limit:50})}<div style="padding:0 16px 14px"><button type="button" class="ghost" data-wl-act="clearlog">Clear history</button></div></details>`}

function wlRiskText(f,s){const n=k=>{const v=parseFloat(f.elements[k].value);return isFinite(v)&&v>0?v:null},pv=n("pivot"),sp=n("stop"),tg=n("target"),rk=n("risk"),px=pxOf(s);
  if(!pv||!sp)return `Set a pivot and a stop to see risk and position size.${isNum(px)?` Price now ₹${inr(px)}.`:""}`;
  if(sp>=pv)return `<span class="down">Stop must be below the pivot.</span>`;
  const r=(pv-sp)/pv*100;let t=`Risk from pivot to stop: <b>${r.toFixed(1)}%</b>${r>8?` <span class="down">(wider than 7–8% — most pros keep it tighter)</span>`:""}`;
  if(tg&&tg>pv)t+=` · Reward/risk: <b>${((tg-pv)/(pv-sp)).toFixed(1)}×</b>`;
  if(rk){const sh=Math.floor(rk/(pv-sp));t+=`<br>For ₹${rk.toLocaleString("en-IN")} risk: <b>${sh.toLocaleString("en-IN")} shares</b> ≈ ₹${Math.round(sh*pv).toLocaleString("en-IN")} position`}
  return t}
function wireWlCard(s){const f=document.querySelector(`[data-wl-form="${CSS.escape(s)}"]`);if(!f)return;const upd=()=>$("#wlrisk").innerHTML=wlRiskText(f,s);upd();f.addEventListener("input",upd);

    it.d=inp.value>D.meta.asof?D.meta.asof:inp.value;const i=clIdx(it.d),c=CL.c[s],bc=CL.c[benchName()];if(i>=0&&c&&isNum(c[i]))it.p=c[i];if(i>=0&&bc&&isNum(bc[i]))it.b=bc[i];wlSave();if(st.tab==="watch")drawWatch();openDrawer(s,null,true)}));
  document.querySelectorAll(`[data-wl-p][data-sym="${CSS.escape(s)}"]`).forEach(inp=>inp.addEventListener("change",()=>{const it=wlList(inp.dataset.wlP).items.find(i=>i.s===s);const v=parseFloat(inp.value);if(it&&isFinite(v)&&v>0){it.p=v;wlSave();if(st.tab==="watch")drawWatch();openDrawer(s,null,true)}}))}
function priceChart(s){const c=CL?.c?.[s];if(!c||c.filter(isNum).length<30)return "";
  const n=c.length,W=PCW,H=Math.round(Math.min(330,Math.max(230,PCW*.46))),pl=50,pr=8,pt=10,pb=26,m=wlGet().meta[s]||{},ma=c.map((v,i)=>sma50(c,i));
  const items=wlListsOf(s).map(l=>l.items.find(i=>i.s===s)).filter(Boolean);
  const v=c.filter(isNum);let lo=Math.min(...v),hi=Math.max(...v);
  for(const k of ["pivot","stop","target"])if(isNum(m[k])&&m[k]>lo*.6&&m[k]<hi*1.5){lo=Math.min(lo,m[k]);hi=Math.max(hi,m[k])}
  const pad=(hi-lo)*.06;lo-=pad;hi+=pad;
  const x=i=>pl+i*(W-pl-pr)/(n-1),y=t=>pt+(1-(t-lo)/(hi-lo))*(H-pt-pb);
  let g="";const ticks=4;for(let k=0;k<=ticks;k++){const t=lo+(hi-lo)*k/ticks;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--track)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${t>=1000?Math.round(t).toLocaleString("en-IN"):t.toFixed(t>=100?0:1)}</text>`}
  const step=Math.ceil(n/4);for(let i=Math.floor(step/2);i<n;i+=step)g+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle">${new Date(CL.dates[i]+"T00:00:00").toLocaleDateString("en-IN",{month:"short",year:"2-digit"})}</text>`;
  const line=(arr,st)=>`<polyline points="${arr.map((t,i)=>isNum(t)?`${x(i).toFixed(1)},${y(t).toFixed(1)}`:null).filter(Boolean).join(" ")}" fill="none" ${st}/>`;
  g+=line(ma,`stroke="var(--s2)" stroke-width="1.8"`)+line(c,`stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"`);
  const hl=(val,col,lab,below)=>isNum(val)&&val>=lo&&val<=hi?`<line x1="${pl}" x2="${W-pr}" y1="${y(val)}" y2="${y(val)}" stroke="${col}" stroke-width="1.6" stroke-dasharray="6 4"/><text x="${pl+6}" y="${below?y(val)+16:y(val)-5}" style="fill:${col};font-weight:700">${lab} ${inr(val)}</text>`:"";
  g+=hl(m.pivot,"var(--up-t)","Pivot")+hl(m.stop,"var(--down-t)","Stop",1)+hl(m.target,"var(--muted)","Target");
  for(const it of items){const i=clIdx(it.d);if(i>=0&&isNum(c[i]))g+=`<circle cx="${x(i)}" cy="${y(c[i])}" r="5" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>`}
  g+=`<line class="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" opacity="0"/>`;
  return `<div class="dsec pchart" id="pchart"><h4>Price, last 12 months</h4><div class="legend"><span><i style="--c:var(--s1)"></i>Close</span><span><i style="--c:var(--s2)"></i>50-day average</span>${items.length?`<span>◯ Added</span>`:""}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(s)} daily closes for the last 12 months with 50-day average" style="display:block;touch-action:pan-y">${g}<rect x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div></div>`}

function resEvidence(E){

  const bar=v=>!isNum(v)?"–":`<span class="ebar${v<0?" neg":""}" style="width:${Math.max(2,Math.round(Math.abs(v)/mx*90))}px"></span><span class="num" style="font-weight:700">${sgn(v,1)}</span>`;
  const t1=`<div class="tscroll"><table class="dt etab"><thead><tr><th class="l">PEAD score</th><th class="l">Avg next ${E.h} sessions vs NIFTY 500</th><th>Median</th><th>Beat the index</th><th class="l">${esc(E.era_a)}</th><th class="l">${esc(E.era_b)}</th><th>Results</th></tr></thead><tbody>`+
    E.pead_bands.map(r=>`<tr><td class="l"><b>${esc(r.label)}</b></td><td class="l">${bar(r.avg)}</td><td class="num">${sgn(r.med,1)}</td><td class="num">${r.win.toFixed(0)}%</td><td class="l">${bar(r.a)}</td><td class="l">${bar(r.b)}</td><td class="num">${r.n.toLocaleString("en-IN")}</td></tr>`).join("")+`</tbody></table></div>`;
  const t2=`<div class="tscroll"><table class="dt etab"><thead><tr><th class="l">Result Quality</th><th>Next quarter's operating profit also up on the year</th><th>Two quarters on</th><th class="l">Avg next ${E.h} sessions vs NIFTY 500</th><th>Beat the index</th><th>Results</th></tr></thead><tbody>`+
    E.quality_bands.map(r=>`<tr><td class="l">${r.g?`<span class="gpill ${GRADE[r.g][2]}">${esc(r.label)}</span>`:`<b>${esc(r.label)}</b>`}</td><td class="num"><b>${r.persist.toFixed(0)}%</b></td><td class="num">${isNum(r.persist2)?r.persist2.toFixed(0)+"%":"–"}</td><td class="l">${bar(r.avg)}</td><td class="num">${r.win.toFixed(0)}%</td><td class="num">${r.n.toLocaleString("en-IN")}</td></tr>`).join("")+`</tbody></table></div>`;
  const qb=E.grid_q,pb=E.grid_p;
  const t3=E.grid?`<div class="tscroll"><table class="dt etab"><thead><tr><th class="l">PEAD ↓ · Quality →</th>${qb.map(b=>`<th>${esc(b)}</th>`).join("")}</tr></thead><tbody>`+
    pb.map(p=>`<tr><td class="l"><b>${esc(p)}</b></td>${qb.map(q=>{const g=E.grid.find(x=>x.p===p&&x.q===q);return g?(g.n<100?`<td class="num" style="color:var(--muted)" title="Too few results to read much into">${sgn(g.avg,1)}<span class="bsub" style="display:block">only ${g.n} results</span></td>`:`<td class="num"><b class="${cls(g.avg)}">${sgn(g.avg,1)}</b><span class="bsub" style="display:block">${g.n.toLocaleString("en-IN")} results</span></td>`):"<td>–</td>"}).join("")}</tr>`).join("")+`</tbody></table></div>`:"";
  const parts=(title,P)=>`<div><h4>${esc(title)}</h4><div class="tscroll"><table class="dt etab"><thead><tr><th class="l">Part</th><th>Points</th><th class="l">How it is scored</th></tr></thead><tbody>`+
    P.map(x=>`<tr><td class="l"><b>${esc(x.name)}</b></td><td class="num">${x.max}</td><td class="l wrapcell" style="min-width:260px">${esc(x.rule)}</td></tr>`).join("")+`</tbody></table></div></div>`;
  return `<details class="card evid"${store.get("rxEv",false)?" open":""}><summary>${esc(E.title)} <span>— how the two scores were built and tested</span></summary><div class="evb">
    <ul class="fl">${E.findings.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    <h4>PEAD score: what happened after the result (returns from the close of the second session after the result)</h4>${t1}
    <h4>Result Quality Score: did the quarter's strength last, and how did the stock do?</h4>${t2}
    ${t3?`<h4>Both scores together (average next ${E.h} sessions vs NIFTY 500)</h4>${t3}`:""}
    <div class="egrid two">${parts("PEAD score (0–9)",E.pead_parts)}${parts("Result Quality Score (0–100)",E.quality_parts)}</div>
    <p class="note">${esc(E.data)} ${esc(E.caveats)}</p>
    <p class="note"><b>Research behind it:</b> ${E.sources.map(s=>`<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>`).join(" · ")}</p></div></details>`}

async function searchList(){

}
function qScore(o,q){const s=o.s,n=o.n.toUpperCase();if(s===q)return 0;if(s.startsWith(q))return 1;if(n.startsWith(q))return 2;if(s.includes(q))return 3;if(n.split(/[\s.&()-]+/).some(w=>w.startsWith(q)))return 4;return n.includes(q)?5:9}

async function runSearch(){

  if(!q){closeSearch();return}
  const L=await searchList();if(inp.value.trim().toUpperCase()!==q)return;
  const res=L.map(o=>[qScore(o,q),o]).filter(a=>a[0]<9).sort((a,b)=>a[0]-b[0]||(b[1].x?.mc||0)-(a[1].x?.mc||0)).slice(0,10).map(a=>a[1]);

      return `<button type="button" class="opt" role="option" id="gqo${i}" aria-selected="${i===0}" data-i="${i}"><b>${hl(o.s,q)}</b><span class="rt">${right}</span><span class="nm">${hl(o.n,q)}</span></button>`}).join("")+`<div class="hint">↑ ↓ to move · Enter to open · Esc to close</div>`
    :`<div class="none">No stock matches “${esc(raw)}”. Searchable: NSE stocks that pass the liquidity filter (price ≥ ₹20, median turnover ≥ ₹1 Cr) plus every stock in the VPCI list.</div>`;

window.addEventListener("hashchange",()=>{const t=location.hash.slice(1);if(HASHVIEW[t]){if(st.tab!=="scanners"||st.scanView!==HASHVIEW[t])go(t);return}if(TABS.includes(t)&&(t!==st.tab||(t==="scanners"&&VIEWHASH[st.scanView]))){if(t==="scanners")st.scanView="lib";go(t)}});
$("#themeBtn").addEventListener("click",()=>{const d=document.documentElement,cur=d.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");d.dataset.theme=cur==="dark"?"light":"dark";store.set("theme",d.dataset.theme)});
(()=>{const t=store.get("theme",null);if(t)document.documentElement.dataset.theme=t;Object.assign(st,store.get("prefs",{}));st.uni=store.get("uni","all");st.rrgset=store.get("rrgset","sector");st.gsig=store.get("gsig",{kind:"all",win:"5"});Object.assign(st.rs,store.get("rs",{}));Object.assign(st.bx,store.get("bx",{}));Object.assign(st.s2,store.get("s2",{}));Object.assign(st.rx,store.get("rx",{}));st.rx.q="";st.rx.season="";st.scanView=store.get("scanView","lib");st.scan=store.get("scan2",st.scan);st.scanTop=+store.get("scanTop",0)||0;st.scanFund=+store.get("scanFund",0)||0;
  Object.assign(st.mf,store.get("mf",{}));st.mf.q="";
  const h=location.hash.slice(1);if(HASHVIEW[h]){st.scanView=HASHVIEW[h];st.tab="scanners"}else{if(h==="scanners")st.scanView="lib";st.tab=TABS.includes(h)?h:store.get("tab","rotation")}})();

load().then(()=>{index();renderHeader();renderFoot();render();updateWlBadge();wlCheckShared();syncPull();vpxLoad().then(()=>{refreshStars();updateWlBadge()})}).catch(err=>{
  $("#asof").textContent="";
  $("#view").innerHTML=`<div class="err"><b>Data files could not be loaded.</b><br>${esc(err.message)}. The evening job may not have run yet — open the Actions tab on GitHub, run “Daily update” once, then reload.</div>`;
});
</script>
